aid: klump
name: Klump
description: 'Klump Technology Company Ltd is a Lagos, Nigeria based fintech whose flagship
  product, Klump BNPL (Buy Now, Pay Later), lets shoppers spread the cost of a purchase
  over monthly instalments at online and in-store merchant checkouts. Merchants integrate
  Klump either through the Klump.js client-side checkout widget, a framework component
  (React, Vue 2, Vue 3, Angular, React Native, Flutter), an e-commerce plugin (WooCommerce/WordPress,
  Magento 2, PrestaShop, OpenCart, WHMCS), a Laravel package, or directly against the
  Klump REST API at https://api.useklump.com. The API is secret-key authenticated via
  a klump-secret-key header, uses one base URL for both sandbox and production (the key
  and the merchant application state, TEST or LIVE, select the environment), and covers
  transaction verification, Klump Commerce product sync, Klump Access hosted payment
  pages, and webhook resend. Klump emits transaction lifecycle webhooks (initiated,
  successful, abandoned) signed with an X-Klump-Signature HMAC header and retried hourly
  for 72 hours. Klump is backed by Seedcamp and displays a PCI DSS Compliant badge.'
