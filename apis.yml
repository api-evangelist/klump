apis:
- aid: klump:klump-api
  name: Klump API
  description: 'The Klump REST API lets a merchant verify transactions, sync commerce
    product catalogs, create Klump Access hosted payment pages, and resend webhooks.
    A single base URL serves both sandbox and production; the environment is selected
    by whether the merchant application state is TEST or LIVE and by which secret key
    is presented. Every request must carry the merchant secret key in a klump-secret-key
    header; the public key (klp_pk_ prefix) is used client side with the Klump.js widget.'
