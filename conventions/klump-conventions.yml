idempotency:
  supported: true
  scope: webhook-delivery
  request_header: null
  webhook_key_header: X-Klump-Webhook-Id
  attempt_header: X-Klump-Webhook-Attempt
  description: Klump's documented idempotency contract is on the inbound event side.
    Webhook deliveries are at-least-once (retried hourly for 72 hours until a 2xx is
    returned), each delivery carries an X-Klump-Webhook-Id that is stable across
    retries, and Klump explicitly instructs merchants to deduplicate on that ID and
    never process the same webhook twice. On the request side, a duplicate call is
    signalled by HTTP 409 Conflict, documented as "there is a high likelihood that we
    have already treated this request". Klump does not publish a client-supplied
    Idempotency-Key request header.
  retention: not published
